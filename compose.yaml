# SOFIX: the whole platform from one file. Run in this folder:
#
#   cp .env.example .env        # once; then adjust what you need (every setting is listed there)
#   docker compose up -d --build
#
#   ui        sofix-ui-fe: the app (nginx), also proxies /api and /ws to the backend  :8080
#   backend   sofix-ui-be: the app's API (BFF), users, access, the app's data          :8090
#   oems      sofix-oems: the FIX OEMS (Spring Boot + QuickFIX/J)                      :8095, FIX 9870-9899
#   postgres  one PostgreSQL server with two databases (sofix for the backend, oems)   :5433
#   db-init   one-shot job: creates the databases and users when missing
#
# DEPLOYMENT_MODE (SELL_SIDE or BUY_SIDE) says which side this stack serves; run a second stack
# for the other side (docs/deployment/docker.md, 2.6).
# Everything is configurable with environment variables (a .env file next to this one, or the
# shell); docs/deployment/docker.md explains each one. Defaults suit one machine; for a server,
# set at least PUBLIC_URL and the passwords.
name: ${COMPOSE_PROJECT_NAME:-sofix}

x-restart: &restart
  restart: ${RESTART_POLICY:-unless-stopped}

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: ${DOCKER_LOG_MAX_SIZE:-20m}
      max-file: '${DOCKER_LOG_MAX_FILES:-5}'

services:
  # --- PostgreSQL: one server, two databases (CLAUDE.md: "one PostgreSQL server, two databases") ---
  postgres:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-sofix}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-sofix}
      # The database created on an empty volume; db-init creates the others.
      POSTGRES_DB: ${UI_DB_NAME:-sofix}
      TZ: ${TZ:-UTC}
    ports:
      - '${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    <<: *logging
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: ${DB_INIT_HOST:-postgres}
      PGPORT: ${DB_INIT_PORT:-5432}
      PGUSER: ${POSTGRES_SUPERUSER:-sofix}
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-sofix}
      UI_DB_NAME: ${UI_DB_NAME:-sofix}
      UI_DB_USER: ${UI_DB_USER:-sofix}
      UI_DB_PASSWORD: ${UI_DB_PASSWORD:-sofix}
      OEMS_DB_NAME: ${OEMS_DB_NAME:-oems}
      OEMS_DB_USER: ${OEMS_DB_USER:-oems}
      OEMS_DB_PASSWORD: ${OEMS_DB_PASSWORD:-oems}
    volumes:
      - ./docker/postgres/init-databases.sh:/init-databases.sh:ro
    entrypoint: ['sh', '/init-databases.sh']

  # --- the FIX OEMS ---
  oems:
    build: ./sofix-oems
    image: ${IMAGE_PREFIX:-sofix}/oems:${IMAGE_TAG:-local}
    init: true
    <<: [*restart, *logging]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SOFIX_DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-SELL_SIDE}
      OEMS_HTTP_PORT: 8095
      OEMS_DB_URL: jdbc:postgresql://${OEMS_DB_HOST:-postgres}:${OEMS_DB_PORT:-5432}/${OEMS_DB_NAME:-oems}${OEMS_DB_URL_PARAMS:-}
      OEMS_DB_USER: ${OEMS_DB_USER:-oems}
      OEMS_DB_PASSWORD: ${OEMS_DB_PASSWORD:-oems}
      OEMS_SECRET_KEY: ${OEMS_SECRET_KEY:-}
      OEMS_FIX_DATA_DIR: /data/qfj
      OEMS_LOG_DIR: /logs
      OEMS_CERTIFICATION_CHUNK_DELAY: ${OEMS_CERTIFICATION_CHUNK_DELAY:-900ms}
      OEMS_CERTIFICATION_TEST_CASES_DELAY: ${OEMS_CERTIFICATION_TEST_CASES_DELAY:-1500ms}
      SOFIX_EXTENSIONS_SPECIFICATIONCATALOG: ${OEMS_SPECIFICATION_CATALOG:-classpath}
      SOFIX_EXTENSIONS_FIXDICTIONARY: ${OEMS_FIX_DICTIONARY:-qfj}
      JAVA_OPTS: ${OEMS_JAVA_OPTS:--XX:MaxRAMPercentage=75}
      TZ: ${TZ:-UTC}
    ports:
      # REST API and Actuator (/actuator/health, /actuator/prometheus). The browser never
      # calls it; published for tools and monitoring.
      - '${OEMS_BIND:-127.0.0.1}:${OEMS_HOST_PORT:-8095}:8095'
      # FIX acceptors listen on the port each session names: it must be in this range.
      - '${FIX_BIND:-0.0.0.0}:${FIX_PORT_RANGE:-9870-9899}:${FIX_PORT_RANGE:-9870-9899}'
    volumes:
      - oems-fix-data:/data
      - ${OEMS_LOGS:-./logs/oems}:/logs
    extra_hosts:
      # Initiator sessions reach FIX counterparties on this machine as host.docker.internal.
      - 'host.docker.internal:host-gateway'

  # --- the backend (BFF) ---
  backend:
    build: ./sofix-ui-be
    image: ${IMAGE_PREFIX:-sofix}/ui-be:${IMAGE_TAG:-local}
    init: true
    <<: [*restart, *logging]
    depends_on:
      db-init:
        condition: service_completed_successfully
      oems:
        # The backend waits for the OEMS on its own (and tells the app while it is down).
        condition: service_started
    environment:
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-SELL_SIDE}
      PORT: 8090
      OEMS_URL: ${OEMS_URL:-http://oems:8095}
      DATABASE_URL: postgres://${UI_DB_USER:-sofix}:${UI_DB_PASSWORD:-sofix}@${UI_DB_HOST:-postgres}:${UI_DB_PORT:-5432}/${UI_DB_NAME:-sofix}${UI_DB_URL_PARAMS:-}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      APP_URL: ${PUBLIC_URL:-http://localhost:8080}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-sofix-admin}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      ENABLE_TEST_API: ${ENABLE_TEST_API:-0}
      # SSO is off unless all of OIDC_ISSUER, OIDC_CLIENT_ID and OIDC_CLIENT_SECRET are set.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-SSO}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-${PUBLIC_URL:-http://localhost:8080}/api/auth/sso/callback}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      TZ: ${TZ:-UTC}
    ports:
      # Published for `npm start` in sofix-ui-fe (ng serve talks to :8090) and tools; the
      # Docker app reaches the backend through the ui container.
      - '${BACKEND_BIND:-127.0.0.1}:${BACKEND_HOST_PORT:-8090}:8090'

  # --- the app ---
  ui:
    build: ./sofix-ui-fe
    image: ${IMAGE_PREFIX:-sofix}/ui-fe:${IMAGE_TAG:-local}
    <<: [*restart, *logging]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      UI_PORT: 8080
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-http://backend:8090}
      SOFIX_API_URL: ${SOFIX_API_URL:-/api}
      SOFIX_WS_URL: ${SOFIX_WS_URL:-/ws}
      UI_MAX_UPLOAD_SIZE: ${UI_MAX_UPLOAD_SIZE:-25m}
      UI_PROXY_TIMEOUT: ${UI_PROXY_TIMEOUT:-300s}
      TZ: ${TZ:-UTC}
    ports:
      - '${UI_BIND:-0.0.0.0}:${UI_HOST_PORT:-8080}:8080'

volumes:
  # Default names keep the data of the earlier setup: the app's database (the volume the
  # first compose file created), and nothing new for the OEMS's FIX stores.
  postgres-data:
    name: ${POSTGRES_VOLUME:-sofix-mock-backend_postgres-data}
  oems-fix-data:
    name: ${OEMS_FIX_DATA_VOLUME:-sofix_oems-fix-data}
